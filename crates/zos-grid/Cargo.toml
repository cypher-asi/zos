[package]
name = "zos-grid"
version = "0.1.0"
edition = "2021"

[dependencies]
zero-sdk = { path = "../../../zero-sdk/crates/zero-sdk" }
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
hex = "0.4"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
