[package]
name = "zero-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
zero-server = { path = "../zero-server" }
axum = "0.7"
wry = "0.54"
tao = "0.34"
tokio = { version = "1", features = ["full"] }
dirs = "5"
dotenvy = "0.15"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[package.metadata.packager]
product-name = "ZERO"
identifier = "com.zero.desktop"
category = "DeveloperTool"
icons = ["assets/icon.png"]
before-packaging-command = "cargo build --release --package zero-desktop"
resources = ["../../interface/dist"]
